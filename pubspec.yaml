name: domlx
description: A Dart client library for oMLX (OpenAI-compatible local LLM for Apple Silicon) with reasoning, tool calling, structured output, TTS & STT.
version: 1.0.1
repository: https://github.com/rxlabz/domlx

environment:
  sdk: ^3.13.3

dependencies:
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.17.1
  coverage: ^1.16.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  lints: ^6.1.0
  test: ^1.33.0
